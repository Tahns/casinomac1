<!doctype html>
<html lang="en" data-lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<script>/* langue et sens d'écriture posés dès le parsing, avant le premier rendu : ?lang= (16 codes Stake) > sauvegarde locale > anglais ; arabe = rtl. js/i18n.js reprend la main ensuite. */
(function(){var L='ar de en es fi fr hi id ja ko pl pt ru tr vi zh'.split(' '),l=null,d=document.documentElement;
function n(c){c=String(c||'').toLowerCase().replace('_','-').split('-')[0];return L.indexOf(c)>=0?c:null}
try{l=n(new URLSearchParams(location.search).get('lang'))}catch(e){}
if(!l)try{var s=JSON.parse(localStorage.getItem('anubis_save_v1')||localStorage.getItem('hoa_save_v1')||'null');l=s&&s.langSet?n(s.lang):null}catch(e){}
l=l||'en';d.lang=l;d.setAttribute('data-lang',l);d.dir=l==='ar'?'rtl':'ltr'})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0907">
<title>Anubis Unchained</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-14 -20 28 40'%3E%3Cg fill='none' stroke='%23e6b94a' stroke-width='4.6' stroke-linecap='round'%3E%3Cellipse cx='0' cy='-11' rx='7.4' ry='9.4'/%3E%3Cpath d='M0 -1.5V17M-10.5 5.5H10.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preload" href="fonts/cinzel-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/rgs.css">
<link rel="stylesheet" href="css/replay.css">
</head>
<body>
<canvas id="stage" role="img" aria-label="Anubis Unchained, the wheel of judgement"></canvas>

<div id="ui">
  <header id="top">
    <canvas id="hdrChain" aria-hidden="true"></canvas>
    <div class="brand">
      <span class="b-small" data-i="brandTop">ANUBIS</span>
      <span class="b-big">UNCHAINED</span>
    </div>
    <div class="top-right">
      <button class="ibtn" id="btnLang" type="button" aria-label="Language">EN</button>
      <button class="ibtn" id="btnCur" type="button" aria-label="Devise"></button>
      <button class="ibtn" id="btnSound" type="button" aria-label="Son" aria-expanded="false" aria-haspopup="dialog" aria-controls="mixer"><svg viewBox="0 0 24 24"><path id="sndPath" d="M4 9v6h4l5 4V5L8 9H4z"/><path id="sndWave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      <button class="ibtn" id="btnInfo" type="button" aria-label="Info" aria-haspopup="dialog" aria-controls="modal">i</button>
    </div>
  </header>
  <div id="mixer" hidden role="dialog" aria-labelledby="mxTitle">
    <h2 id="mxTitle">Sound</h2><button class="x" id="mxClose" type="button" aria-label="Close">×</button>
    <div class="mx-row"><label for="mxVol" id="mxVolL">Volume</label><input id="mxVol" type="range" min="0" max="100" step="5"><b id="mxVolV"></b></div>
    <div class="mx-row"><label for="mxTone" id="mxToneL">Treble</label><input id="mxTone" type="range" min="0" max="100" step="5"><b id="mxToneV"></b></div>
    <div class="mx-row"><label for="mxPitch" id="mxPitchL">Pitch</label><input id="mxPitch" type="range" min="-12" max="12" step="1"><b id="mxPitchV"></b></div>
    <div class="mx-row mx-btns"><button id="mxMute" type="button" class="chip"></button><button id="mxSfx" type="button" class="chip"></button><button id="mxMusic" type="button" class="chip"></button><button id="mxReset" type="button" class="chip"></button></div>
  </div>

  <div id="oracle" class="pill" role="status" aria-label="Oracle boost" hidden><svg><use href="#i-eye" width="100%" height="100%"/></svg><span id="oracleText"></span></div>
  <div id="status" role="status" aria-live="polite"><span id="statusText"></span></div>

  <div id="history" role="group" aria-label="Recent rounds"></div>

  <footer id="hud">
    <div class="stat" id="statBal"><label data-i="balance">BALANCE</label><b id="bal">0</b></div>
    <div class="betbox">
      <button class="step" id="betDn" type="button" aria-label="Decrease amount">−</button>
      <div class="betval"><label data-i="bet">AMOUNT</label><b id="bet">0</b><small id="betCost"></small></div>
      <button class="step" id="betUp" type="button" aria-label="Increase amount">+</button>
    </div>
    <button id="spin" type="button" aria-label="Spin">
      <span class="ring"></span>
      <svg class="ank"><use href="#i-ankh" width="100%" height="100%"/></svg>
      <span class="spin-t" id="spinText">SPIN</span>
    </button>
    <div class="toggles">
      <button class="tgl" id="btnTurbo" type="button"><i></i><span data-i="turbo">TURBO</span></button>
      <button class="tgl" id="btnAuto" type="button"><i></i><span id="autoText">AUTO</span></button>
      <button class="tgl buy" id="btnBuy" type="button"><i></i><span id="buyText">BONUS</span></button>
      <button class="tgl plus" id="btnPlus" type="button"><i></i><span id="plusText">ORACLE+</span></button>
    </div>
    <div class="stat win" id="statWin"><label data-i="win">WIN</label><b id="win">0</b></div>
  </footer>

  <div id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="x" id="modalClose" type="button" aria-label="Close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ankh" viewBox="-14 -20 28 40"><g fill="none" stroke="currentColor" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="-11" rx="7.4" ry="9.4"/><path d="M0 -1.5V17M-10.5 5.5H10.5"/></g></symbol>
  <symbol id="i-eye" viewBox="0 0 48 24"><g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12Q22 -2 45 10Q26 24 3 12Z"/><circle cx="25" cy="11" r="4.4" fill="currentColor"/></g></symbol>
</svg>

<div id="splash" hidden role="dialog" aria-modal="true" aria-labelledby="spTitle"><canvas id="spCv" aria-hidden="true"></canvas><div class="spTxt"><div class="spSub1">ANUBIS</div><h1 class="spTitle" id="spTitle">UNCHAINED</h1><p class="spSub" id="spSub"></p><div class="spCar" id="spCar" role="region" aria-roledescription="carousel"><div class="spTrack" id="spTrack"></div><div class="spNav"><button class="spArr" id="spPrev" type="button"><svg viewBox="0 0 12 20" aria-hidden="true"><path d="M9 2 3 10l6 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div class="spDots" id="spDots"></div><button class="spArr" id="spNext" type="button"><svg viewBox="0 0 12 20" aria-hidden="true"><path d="m3 2 6 8-6 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button class="spSkip" id="spSkip" type="button"></button></div></div><button class="spBtn" id="spBtn" type="button"></button><p class="spDemo" id="spDemo"></p></div></div>
<script src="js/build.js"></script>
<script src="js/math.js"></script>
<script src="js/rgs.js"></script>
<script src="js/art.js"></script>
<script src="js/chains.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/i18n.js"></script>
<script src="js/social.js"></script>
<script src="js/currency.js"></script>
<script src="js/grade.js"></script>
<script src="js/imgs.js"></script>
<script src="js/game.js"></script>
<script src="js/bonuses.js"></script>
<script src="js/stats.js"></script>
<script src="js/rules.js"></script>
<script src="js/replay.js"></script>
<script src="js/main.js"></script>
</body>
</html>
